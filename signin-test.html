<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Intelligence sign-in test</title><link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#08345f}button{font:inherit;font-weight:700;padding:12px 18px;border-radius:10px;border:0;background:#0b5cad;color:#fff}pre{white-space:pre-wrap;background:#f4f8fb;padding:12px;border-radius:8px}</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head><body>
<h1>Sign-in test</h1>
<p>Checks whether your GRPS account can let School Intelligence read your Visit Notes sheet.</p>
<button id="go">Sign in with Google</button>
<pre id="out">Not started.</pre>
<script>
const CLIENT_ID='378122368835-1gscejk0utt23e6pe54e01r8dts4ho2l.apps.googleusercontent.com';
const SHEET='1mr7_iDhcqaoxVbKaP47COyPBoIcQtHU8e4pmVhTfWt4';
const out=t=>document.getElementById('out').textContent=t;
document.getElementById('go').onclick=()=>{
  if(!window.google||!google.accounts){out('Google sign-in did not load.');return}
  const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets',hint:'atkinsme@students.grps.org',
    callback:async r=>{ if(r.error){out('Sign-in error: '+r.error+' '+(r.error_description||''));return}
      try{const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET+'?fields=properties.title,sheets.properties.title',{headers:{Authorization:'Bearer '+r.access_token}});
        const j=await res.json(); out(res.ok?'PASS: read "'+j.properties.title+'" with tabs: '+j.sheets.map(s=>s.properties.title).join(', '):'Read failed ('+res.status+'): '+JSON.stringify(j.error||j));}
      catch(e){out('Request failed: '+e)}},
    error_callback:e=>out('Sign-in window problem: '+(e.type||e))});
  c.requestAccessToken();
};
</script></body></html>
